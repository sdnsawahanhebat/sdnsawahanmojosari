name: Generate share pages

on:
  push:
    branches: [main, master]
    paths-ignore: ['s/**']
  schedule:
    - cron: '*/30 * * * *'   # cek data baru tiap 30 menit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-share
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-share.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}   # opsional, isi bila memakai domain sendiri
      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A s index.html
          git diff --cached --quiet || (git commit -m "chore: update share pages [skip ci]" && git push)
